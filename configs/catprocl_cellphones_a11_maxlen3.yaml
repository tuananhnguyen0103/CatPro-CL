# ═══════════════════════════════════════════════════════════════════
# CatPro-CL Config — Amazon CellPhones cold_20 | A11 | maxlen=3
# Session len [2,3] — keep last 3 items per session
# ═══════════════════════════════════════════════════════════════════

data:
  dataset: cellphones_maxlen3
  data_dir: ~/data/amazon_cellphones_unified/cold_20
  cold_ratio: 20
  expected_cold: -1
  maxlen: 3                    # truncate to last 3 items

model:
  hidden_size: 128
  n_gnn_steps: 1

ablation: A11

train:
  epochs: 30
  batch_size: 100
  lr: 0.001
  weight_decay: 1.0e-5
  grad_clip: 5.0
  patience: 5

catprocl:
  ema_momentum: 0.99
  lambda_proto: 0.5
  temperature: 0.1
  perturbation_std: 0.05
  mask_prob: 0.05

eval:
  ks: [10, 20]
  eval_every: 1

seed: 42
output_dir: ~/results_a11/cellphones_maxlen3
checkpoint_dir: ~/checkpoints_a11/cellphones_maxlen3
log_dir: ~/logs_a11/cellphones_maxlen3

device: cuda
num_workers: 6
use_amp: false
