# ═══════════════════════════════════════════════════════════════════
# CatPro-CL Config — RetailRocket cold_20, session len [2,6] | A11
# A11 = A7 + Prototype Simulation Masking
# ═══════════════════════════════════════════════════════════════════

data:
  dataset: retailrocket_maxlen6
  data_dir: ~/data/retailrocket_maxlen6/cold_20
  cold_ratio: 20
  expected_cold: -1

model:
  hidden_size: 128
  n_gnn_steps: 1

ablation: A11

train:
  epochs: 30
  batch_size: 100
  lr: 0.001
  weight_decay: 1.0e-5
  grad_clip: 5.0
  patience: 5

catprocl:
  ema_momentum: 0.99
  lambda_proto: 0.5    # confirmed from grid search (was 0.1)
  temperature: 0.1
  perturbation_std: 0.05
  mask_prob: 0.05      # confirmed from grid search (was 0.2)

eval:
  ks: [10, 20]
  eval_every: 1

seed: 42
output_dir: ~/results_a11/retailrocket_maxlen6
checkpoint_dir: ~/checkpoints_a11/retailrocket_maxlen6
log_dir: ~/logs_a11/retailrocket_maxlen6

device: cuda
num_workers: 6
use_amp: false
