# Ablation: InfoNCE kept (λ=0.5), NO PSM (ρ=0)
# Purpose: isolate InfoNCE contribution to cold-start performance
# Compared to A11 (λ=0.5, ρ=0.05) → difference = PSM effect

data:
  dataset: retailrocket
  data_dir: ~/data/retailrocket_unified/cold_20
  cold_ratio: 20
  expected_cold: -1

model:
  hidden_size: 128
  n_gnn_steps: 1

ablation: A11

train:
  epochs: 30
  batch_size: 100
  lr: 0.001
  weight_decay: 1.0e-5
  grad_clip: 5.0
  patience: 5

catprocl:
  ema_momentum: 0.99
  lambda_proto: 0.5      # InfoNCE active
  temperature: 0.1
  perturbation_std: 0.05
  mask_prob: 0.0         # ← PSM DISABLED

eval:
  ks: [10, 20]
  eval_every: 1

seed: 42
output_dir: ~/results_ablation/retailrocket/no_psm
checkpoint_dir: ~/checkpoints_ablation/retailrocket/no_psm
log_dir: ~/logs_ablation/retailrocket/no_psm

device: cuda
num_workers: 6
use_amp: false
