# Ablation: NO InfoNCE (λ=0), PSM kept (ρ=0.05)
# Purpose: isolate PSM contribution to cold-start performance
# Compared to A11 (λ=0.5, ρ=0.05) → difference = InfoNCE effect

data:
  dataset: retailrocket
  data_dir: ~/data/retailrocket_unified/cold_20
  cold_ratio: 20
  expected_cold: -1

model:
  hidden_size: 128
  n_gnn_steps: 1

ablation: A11   # keep A11 so PSM code path is active

train:
  epochs: 30
  batch_size: 100
  lr: 0.001
  weight_decay: 1.0e-5
  grad_clip: 5.0
  patience: 5

catprocl:
  ema_momentum: 0.99
  lambda_proto: 0.0      # ← InfoNCE DISABLED
  temperature: 0.1
  perturbation_std: 0.05
  mask_prob: 0.05        # PSM still active

eval:
  ks: [10, 20]
  eval_every: 1

seed: 42
output_dir: ~/results_ablation/retailrocket/no_infonce
checkpoint_dir: ~/checkpoints_ablation/retailrocket/no_infonce
log_dir: ~/logs_ablation/retailrocket/no_infonce

device: cuda
num_workers: 6
use_amp: false
